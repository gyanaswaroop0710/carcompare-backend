# Database: defaults to a file on your Mac so data survives restarts.
# Set DB_URL / DB_USER / DB_PASS (e.g. for Neon Postgres) to use a different database.
server.port=8080
spring.datasource.url=${DB_URL:jdbc:h2:file:~/carcompare-data/carcompare;MODE=MySQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Show our error messages (e.g. "Invalid email or password") in API error responses
server.error.include-message=always